<header class="site-header shadow-sm">
    <nav class="navbar navbar-expand-lg" aria-label="Navegação principal">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center gap-2" href="#inicio" (click)="fecharMenu()" aria-label="Ir para o início">
                <span class="brand-symbol" aria-hidden="true">A</span>

                <span class="brand-text">
                    <span class="d-block fw-semibold">
                        {{ nomeProfissional }}
                    </span>

                    <span class="d-block brand-subtitle">
                        CIRURGIÃ-DENTISTA
                    </span>
                </span>
            </a>

            <button class="navbar-toggler d-lg-none" type="button" (click)="alternarMenu()" [attr.aria-expanded]="menuAberto" aria-controls="navbarMenu" [attr.aria-label]="menuAberto ? 'Fechar menu' : 'Abrir menu'">
                <span class="menu-icon" [class.menu-icon-open]="menuAberto" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>

            <div id="navbarMenu" class="collapse navbar-collapse" [class.show]="menuAberto">
                <ul class="navbar-nav align-items-lg-center mx-lg-auto gap-lg-1">
                    @for (link of links; track link.destino) {
                    <li class="nav-item">
                        <a class="nav-link" [href]="link.destino" (click)="fecharMenu()">
                            {{ link.texto }}
                        </a>
                    </li>
                    }
                </ul>
            </div>

        </div>
    </nav>
</header>
