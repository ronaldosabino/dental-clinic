<main class="not-found-page py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-7">

                <section class="not-found-content text-center">

                    <div class="not-found-icon mx-auto mb-4" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.35-4.35" />
                            <path d="M8 11h6" />
                        </svg>
                    </div>

                    <span class="not-found-label">
                        ERRO 404
                    </span>

                    <h1 class="not-found-title mt-3 mb-3">
                        Ops! Esta página não foi encontrada.
                    </h1>

                    <p class="not-found-description mx-auto mb-4">
                        Parece que o endereço que você acessou não existe. Mas não se preocupe, podemos ajudar
                        você a encontrar o que procura.
                    </p>

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">

                        <a routerLink="/" class="btn btn-home">
                            Voltar ao início <i class="bi bi-house-door ms-2"></i>
                        </a>

                        <a [href]="linkWhatsapp" class="btn btn-contact " target="_blank" rel="noopener noreferrer">
                            Entrar em contato
                            <i class="bi bi-arrow-up-right ms-2"></i>
                        </a>

                    </div>

                    <p class="not-found-footer mt-5 mb-0">
                        Dra. Alanda Bezerra · Cuidado com seu sorriso.
                    </p>

                </section>

            </div>
        </div>
    </div>
</main>
